[project]
name = "ai-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "unravel-ljl", email = "729148130@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.52.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-portfolio = "ai_portfolio:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
